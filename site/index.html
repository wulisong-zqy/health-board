<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>门店健康度看板</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --line:#e5e7eb; --text:#1f2328; --muted:#6b7280;
    --good-bg:#e8f6ed; --good:#0a7d3f; --warn-bg:#fdf3e3; --warn:#a35b00;
    --bad-bg:#fdeceb; --bad:#b42318; --brand:#1a6fd4; --brand-bg:#eaf2fd;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
       font-size:14px;line-height:1.5}
  .wrap{max-width:1400px;margin:0 auto;padding:24px 20px 60px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .kpi .lbl{font-size:12px;color:var(--muted);margin-bottom:6px}
  .kpi .val{font-size:26px;font-weight:600;letter-spacing:-.5px}
  .kpi .extra{font-size:12px;color:var(--muted);margin-top:4px}
  nav{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px}
  nav button{background:none;border:none;padding:10px 14px;font-size:14px;cursor:pointer;
             color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
  nav button.active{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
  .panel{display:none} .panel.active{display:block}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  .toolbar input{padding:7px 10px;border:1px solid var(--line);border-radius:7px;
                 background:var(--card);min-width:200px;font-size:13px}
  .ghost{padding:7px 12px;border:1px solid var(--line);background:var(--card);
         border-radius:7px;cursor:pointer;font-size:13px;color:var(--text)}
  .count{margin-left:auto;color:var(--muted);font-size:13px}
  .box{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:auto}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  th{background:#fafbfc;font-weight:600;color:#374151;cursor:pointer;user-select:none;
     position:sticky;top:0;z-index:2}
  th:hover{background:#f0f2f5}
  td.l,th.l{text-align:left}
  tbody tr:hover{background:#f9fafb}
  tfoot td{font-weight:600;background:#fafbfc;border-top:2px solid var(--line)}
  .rate{border-radius:5px;padding:2px 6px;font-variant-numeric:tabular-nums}
  .r-good{background:var(--good-bg);color:var(--good)}
  .r-warn{background:var(--warn-bg);color:var(--warn)}
  .r-bad{background:var(--bad-bg);color:var(--bad)}
  .bar{height:8px;border-radius:4px;background:#eef0f3;overflow:hidden;min-width:70px}
  .bar > i{display:block;height:100%;border-radius:4px}
  .cmp{display:grid;grid-template-columns:150px 1fr 64px 1fr 64px 76px;
       gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
  .cmp:last-child{border-bottom:none}
  .cmp .mn{font-weight:600}
  .note{color:var(--muted);font-size:12px;padding:10px 16px;border-top:1px solid var(--line)}
  .tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px}
  .t-group{background:var(--brand-bg);color:var(--brand)}
  .t-coach{background:#f3e8fd;color:#7c3aed}
  .desc{max-width:420px;white-space:normal;color:#374151;font-size:12px;line-height:1.45}
</style>
</head>
<body>
<div class="wrap">
  <h1>门店健康度看板</h1>
  <div class="sub" id="sub"></div>
  <div class="kpis" id="kpis"></div>
  <nav id="nav"></nav>
  <div id="panels"></div>
</div>

<script>
const DATA = {"board": {"统计日期": "2026-10-29", "评估周期": "2026-10-24~2026-11-23", "数据截止日": "2026-10-29", "评估数量": 19, "健康门店数": 14, "健康率": 73.68, "一票项数量": 0, "一票项-集团": 0, "一票项-协查": 0, "覆盖门店数": 19, "参与人数": 6, "更新时间": "2026-10-29 23:00:40"}, "group": [["陈普勤", 4, 2, 50.0, 0, 0.0, 50.0, 75.0, 50.0, 75.0, 4], ["尹佳辉", 3, 2, 66.67, 0, 33.33, 66.67, 100.0, 100.0, 33.33, 3], ["朱跃飞", 3, 3, 100.0, 0, 66.67, 66.67, 100.0, 100.0, 66.67, 3], ["杨少兵", 3, 1, 33.33, 0, 0.0, 33.33, 100.0, 66.67, 33.33, 3], ["翟浩然", 3, 3, 100.0, 0, 66.67, 33.33, 100.0, 100.0, 33.33, 3], ["高玉宝", 3, 3, 100.0, 0, 66.67, 66.67, 100.0, 100.0, 33.33, 3]], "coach": [], "modules": [{"模块": "产品卓越", "集团": 36.84, "协查": null, "差": null}, {"模块": "干净卫生", "集团": 52.63, "协查": null, "差": null}, {"模块": "亲切服务", "集团": 94.74, "协查": null, "差": null}, {"模块": "团队提升", "集团": 84.21, "协查": null, "差": null}, {"模块": "安全管理", "集团": 47.37, "协查": null, "差": null}], "veto": [], "store": [["南京中南棉花糖餐厅", "1106", "南京四区", "江苏加盟", 1, 0, 73.0, "不健康", "2026-10-29", "集团"], ["南京天元路店餐厅", "1109", "南京四区", "江苏加盟", 1, 1, 81.5, "健康", "2026-10-29", "集团"], ["南京弘阳广场餐厅", "1169", "南京五区", "江苏加盟", 1, 0, 68.5, "不健康", "2026-10-29", "集团"], ["南京高铁网谷餐厅", "1235", "南京五区", "江苏加盟", 1, 0, 74.5, "不健康", "2026-10-29", "集团"], ["合肥董岗荟萃园餐厅", "1252", "安徽加盟八区", "安徽加盟二省区", 1, 1, 85.5, "健康", "2026-10-29", "集团"], ["合肥紫蓬镇店", "1346", "安徽加盟八区", "安徽加盟二省区", 1, 0, 76.0, "不健康", "2026-10-29", "集团"], ["安庆桐城新渡镇店", "1530", "安徽加盟十一区", "安徽加盟二省区", 1, 1, 84.0, "健康", "2026-10-29", "集团"], ["安庆桐城人民医院店", "1651", "安徽加盟十一区", "安徽加盟二省区", 1, 1, 85.0, "健康", "2026-10-29", "集团"], ["南京东善桥店", "1652", "南京五区", "江苏加盟", 1, 0, 72.0, "不健康", "2026-10-29", "集团"], ["绍兴宝龙天地店", "1671", "浙江加盟二区", "浙江加盟一省区", 1, 1, 84.0, "健康", "2026-10-29", "集团"], ["绍兴利佰家广场店", "1724", "浙江加盟二区", "浙江加盟一省区", 1, 1, 80.0, "健康", "2026-10-29", "集团"], ["绍兴港越路店", "1749", "浙江加盟二区", "浙江加盟一省区", 1, 1, 84.0, "健康", "2026-10-29", "集团"], ["肥西花岗店", "1760", "安徽加盟八区", "安徽加盟二省区", 1, 1, 80.0, "健康", "2026-10-29", "集团"], ["安庆桐城范岗镇店", "1924", "安徽加盟十一区", "安徽加盟二省区", 1, 1, 83.5, "健康", "2026-10-29", "集团"], ["长丰长寿路店", "1939", "安徽加盟九区", "安徽加盟二省区", 1, 1, 84.0, "健康", "2026-10-29", "集团"], ["长丰玛特大润发店", "1940", "安徽加盟九区", "安徽加盟二省区", 1, 1, 83.5, "健康", "2026-10-29", "集团"], ["合肥下塘丰迪广场店", "1963", "安徽加盟九区", "安徽加盟二省区", 1, 1, 81.5, "健康", "2026-10-29", "集团"], ["南京谷里U购U生活超市店", "1980", "南京五区", "江苏加盟", 1, 1, 81.5, "健康", "2026-10-29", "集团"], ["南京浦口大洋百货店", "1B23", "南京一区", "江苏加盟", 1, 1, 80.0, "健康", "2026-10-29", "集团"]], "group_rate": 73.68, "coach_rate": null, "group_total": 19.0, "coach_total": 0, "group_n": 6, "coach_n": 0, "generated": "2026-10-29 23:00"};

const fmtInt = v => v == null ? "-" : Number(v).toLocaleString("zh-CN");
const fmtRate = v => v == null ? "-" : Number(v).toFixed(2) + "%";
function rateCls(v){ if(v==null) return ""; return v>=80?"r-good":(v>=60?"r-warn":"r-bad"); }
function rateCell(v){ return '<span class="rate '+rateCls(v)+'">'+fmtRate(v)+'</span>'; }

// ---------- 顶部信息 ----------
const b = DATA.board;
document.title = "门店健康度看板 · " + b["统计日期"];
document.getElementById("sub").textContent =
  "评估周期 " + b["评估周期"] + " · 数据截至 " + b["统计日期"] +
  " · 生成于 " + DATA.generated +
  " · 健康判定：总得分 ≥ 80% 且无一票否决项";

const kpis = [
  ["评估数量", fmtInt(b["评估数量"]), "覆盖 " + fmtInt(b["覆盖门店数"]) + " 家门店"],
  ["整体健康率", '<span class="rate '+rateCls(b["健康率"])+'">'+fmtRate(b["健康率"])+'</span>',
   "健康 " + fmtInt(b["健康门店数"]) + " 家次"],
  ["一票项", fmtInt(b["一票项数量"]), "集团 " + b["一票项-集团"] + " · 协查 " + b["一票项-协查"]],
  ["参与人数", fmtInt(b["参与人数"]), "集团 " + DATA.group_n + " 人 · 协查 " + DATA.coach_n + " 人"],
  ["集团健康率", '<span class="rate '+rateCls(DATA.group_rate)+'">'+fmtRate(DATA.group_rate)+'</span>',
   fmtInt(DATA.group_total) + " 家次"],
  ["协查健康率", '<span class="rate '+rateCls(DATA.coach_rate)+'">'+fmtRate(DATA.coach_rate)+'</span>',
   fmtInt(DATA.coach_total) + " 家次"]
];
document.getElementById("kpis").innerHTML = kpis.map(k =>
  '<div class="kpi"><div class="lbl">'+k[0]+'</div><div class="val">'+k[1]+'</div>'+
  '<div class="extra">'+k[2]+'</div></div>').join("");

// ---------- 通用表格 ----------
function renderTable(rows, cols, opts){
  opts = opts || {};
  const rateSet = new Set(opts.rates||[]);
  let view = rows.slice(), sortKey = null, sortDir = 1;

  const box = document.createElement("div");
  box.innerHTML =
    '<div class="toolbar">' +
      '<input type="search" placeholder="'+(opts.placeholder||"搜索")+'" />' +
      '<button class="ghost dl">导出 CSV</button>' +
      '<span class="count"></span>' +
    '</div>' +
    '<div class="box"><table><thead></thead><tbody></tbody><tfoot></tfoot></table></div>';
  const input = box.querySelector("input");
  const tbl = box.querySelector("table");

  function drawHead(){
    tbl.querySelector("thead").innerHTML = "<tr>" + cols.map(c => {
      const ci = c.idx, name = c.name;
      const cls = c.left ? ' class="l"' : "";
      return "<th"+cls+' data-i="'+ci+'">'+name+"</th>";
    }).join("") + "</tr>";
    tbl.querySelectorAll("th").forEach(th => {
      th.onclick = () => {
        const i = +th.dataset.i;
        if(sortKey === i) sortDir = -sortDir; else { sortKey = i; sortDir = 1; }
        draw();
      };
    });
  }

  function cellHTML(row, c){
    const v = row[c.idx];
    if(c.render) return c.render(v, row);
    if(typeof v === "number") return rateSet.has(c.name) ? rateCell(v) : fmtInt(v);
    return v == null ? "-" : String(v);
  }

  function sortRows(list){
    if(sortKey == null) return list;
    return list.slice().sort((a,z) => {
      let x = a[sortKey], y = z[sortKey];
      if(typeof x === "number" && typeof y === "number") return (x-y)*sortDir;
      x = x == null ? "" : String(x); y = y == null ? "" : String(y);
      return x.localeCompare(y, "zh-CN") * sortDir;
    });
  }

  function draw(){
    const q = (input.value||"").trim().toLowerCase();
    let list = view.filter(r => !q || r.some(v => v!=null && String(v).toLowerCase().includes(q)));
    list = sortRows(list);
    tbl.querySelector("tbody").innerHTML = list.map(r =>
      "<tr>" + cols.map(c => '<td class="'+(c.left?"l":"")+'">'+cellHTML(r,c)+"</td>").join("") + "</tr>"
    ).join("") || '<tr><td class="l" colspan="'+cols.length+'">没有匹配的记录</td></tr>';
    box.querySelector(".count").textContent = list.length + " / " + rows.length + " 行";
    if(opts.footer){
      const f = opts.footer(list);
      tbl.querySelector("tfoot").innerHTML = f ? "<tr>" + cols.map((c,i) =>
        '<td class="'+(c.left?"l":"")+'">'+f[i]+"</td>").join("") + "</tr>" : "";
    }
  }

  box.querySelector(".dl").onclick = () => {
    const q = (input.value||"").trim().toLowerCase();
    const list = sortRows(view.filter(r => !q || r.some(v => v!=null && String(v).toLowerCase().includes(q))));
    const head = cols.map(c => '"'+c.name+'"').join(",");
    const body = list.map(r => cols.map(c => {
      let v = r[c.idx]; v = v==null?"":String(v);
      return '"' + v.replace(/"/g,'""') + '"';
    }).join(",")).join("\n");
    const blob = new Blob(["\ufeff"+head+"\n"+body], {type:"text/csv;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = (opts.filename||"看板数据") + ".csv";
    a.click();
  };

  input.oninput = draw;
  drawHead(); draw();
  return box;
}

function colsOf(names, opts){
  opts = opts||{};
  return names.map((n,i) => ({name:n, idx:i, left: i===0 || (opts.leftCols||[]).includes(i)}));
}

// ---------- 面板 ----------
const panels = [];
function addPanel(name, build){
  const nav = document.getElementById("nav");
  const btn = document.createElement("button");
  btn.textContent = name;
  btn.onclick = () => {
    document.querySelectorAll("nav button").forEach(x => x.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(x => x.classList.remove("active"));
    btn.classList.add("active"); pid.classList.add("active");
  };
  nav.appendChild(btn);
  const pid = document.createElement("div");
  pid.className = "panel";
  build(pid);
  document.getElementById("panels").appendChild(pid);
}

function boardFooter(list){
  const sum = (i) => list.reduce((a,r) => a + (typeof r[i]==="number"?r[i]:0), 0);
  const n = list.length;
  const ev = sum(1), hp = sum(2), vt = sum(4), cov = sum(BOARD_COLS_LEN-1);
  const rate = ev ? hp/ev*100 : null;
  const out = [];
  for(let i=0;i<BOARD_COLS_LEN;i++){
    let v = "-";
    if(n===0) v = "-";
    else if(i===0) v = "合计 " + n + " 人";
    else if(i===1) v = fmtInt(ev);
    else if(i===2) v = fmtInt(hp);
    else if(i===3) v = rate==null?"-":'<span class="rate '+rateCls(rate)+'">'+fmtRate(rate)+"</span>";
    else if(i===4) v = fmtInt(vt);
    else if(i===BOARD_COLS_LEN-1) v = fmtInt(cov);
    else {
      const s = sum(i); v = ev ? '<span class="rate '+rateCls(s/ev*100)+'">'+fmtRate(s/ev*100)+"</span>" : "-";
    }
    out.push(v);
  }
  return out;
}
const BOARD_COLS_LEN = 11;

addPanel("集团看板（部门自评）", root => {
  root.appendChild(renderTable(DATA.group, colsOf(["评估人", "评估数量", "健康门店数", "健康率", "一票项", "产品卓越", "干净卫生", "亲切服务", "团队提升", "安全管理", "覆盖门店"], {leftCols:[0]}), {
    rates: ["健康率", "产品卓越", "干净卫生", "亲切服务", "团队提升", "安全管理"], placeholder:"搜索评估人", filename:"集团看板",
    footer: boardFooter
  }));
  const tip = document.createElement("div");
  tip.className = "note";
  tip.innerHTML = "集团 = 部门自己人评估的门店。健康率色阶：<span class='rate r-good'>≥80%</span> " +
    "<span class='rate r-warn'>60~80%</span> <span class='rate r-bad'>&lt;60%</span>。点表头排序，底部为合计行。";
  root.appendChild(tip);
});

addPanel("协查看板（教练评估）", root => {
    root.appendChild(renderTable(DATA.coach, colsOf(["评估人", "评估数量", "健康门店数", "健康率", "一票项", "产品卓越", "干净卫生", "亲切服务", "团队提升", "安全管理", "覆盖门店"], {leftCols:[0]}), {
    rates: ["健康率", "产品卓越", "干净卫生", "亲切服务", "团队提升", "安全管理"], placeholder:"搜索教练", filename:"协查看板",
    footer: boardFooter
  }));
  const tip = document.createElement("div");
  tip.className = "note";
  tip.innerHTML = "协查 = 教练评估的门店。数据口径与集团看板完全一致，仅评估来源不同。";
  root.appendChild(tip);
});

addPanel("模块对比", root => {
  const box = document.createElement("div");
  box.className = "box";
  box.innerHTML = "<div class='cmp' style='font-weight:600;color:#6b7280;font-size:12px'>" +
    "<div>模块</div><div>集团</div><div>健康率</div><div>协查</div><div>健康率</div><div>差值</div></div>";
  DATA.modules.forEach(m => {
    const mk = v => v==null ? "-" : '<div class="bar"><i style="width:'+Math.max(2,Math.min(100,v))+
      '%;background:'+(v>=80?"#1f9254":(v>=60?"#d68a1e":"#c0392b"))+'"></i></div>';
    const d = m["差"];
    box.innerHTML += "<div class='cmp'>" +
      "<div class='mn'>"+m["模块"]+"</div>" +
      "<div>"+mk(m["集团"])+"</div><div>"+rateCell(m["集团"])+"</div>" +
      "<div>"+mk(m["协查"])+"</div><div>"+rateCell(m["协查"])+"</div>" +
      "<div style='color:"+(d==null?"#6b7280":(d>=0?"#0a7d3f":"#b42318"))+"'>"+
        (d==null?"-":(d>0?"+":"")+d.toFixed(2)+"pp")+"</div></div>";
  });
  box.innerHTML += "<div class='note'>集团 " + fmtInt(DATA.group_total) + " 家次 · 协查 " +
    fmtInt(DATA.coach_total) + " 家次（模块健康率按评估量加权，模块得分率 ≥ 80% 记达标）</div>";
  root.appendChild(box);
});

addPanel("一票项明细", root => {
  const rows = DATA.veto;
  root.appendChild(renderTable(rows, colsOf(["门店名称","门店编号","城市","评估日期","评估人","评估类型","风险项类型","一票项描述","整改状态"],
    {leftCols:[0,6,7,8]}), {
    placeholder:"搜索门店 / 评估人 / 类型 / 描述", filename:"一票项明细",
    footer: list => ["合计 " + list.length + " 条","","","","","","","",""]
  }));
  const cnt = {};
  rows.forEach(r => { const t = r[6] || "未分类"; cnt[t] = (cnt[t]||0)+1; });
  const box = document.createElement("div");
  box.className = "box";
  box.style.marginTop = "12px";
  box.innerHTML = "<div style='padding:12px 16px;font-weight:600'>风险项类型分布</div>";
  Object.entries(cnt).sort((a,z)=>z[1]-a[1]).forEach(([k,v]) => {
    box.innerHTML += "<div class='cmp' style='grid-template-columns:180px 1fr 60px'>" +
      "<div>"+k+"</div><div class='bar'><i style='width:"+Math.max(2,v/rows.length*100)+
      "%;background:#c0392b'></i></div><div>"+v+" 条</div></div>";
  });
  root.appendChild(box);
});

addPanel("门店明细", root => {
  root.appendChild(renderTable(DATA.store, colsOf(["门店名称","门店编号","城市","战队","评估次数","健康次数","健康率","最近状态","最近评估日期","评估类型"],
    {leftCols:[0,2,3,7,9]}), {

<div id="wbShareBar" style="position:fixed;right:18px;bottom:18px;z-index:2147483000;
     font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;">
  <button id="wbShareBtn" type="button"
    style="padding:9px 16px;font-size:13px;line-height:1;cursor:pointer;color:#1f2937;
           background:#ffffff;border:1px solid #d1d5db;border-radius:999px;
           box-shadow:0 2px 10px rgba(0,0,0,.12);white-space:nowrap;">
    🔗 复制本页链接
  </button>
  <div id="wbShareBox"
    style="display:none;margin-bottom:8px;padding:12px;width:min(560px,86vw);
           background:#fff;border:1px solid #d1d5db;border-radius:12px;
           box-shadow:0 8px 28px rgba(0,0,0,.16);">
    <div style="font-size:12px;color:#6b7280;margin-bottom:6px;">
      这是本页完整地址，把它粘到钉钉群快捷栏即可（链接永久，内容每天自动更新）
    </div>
    <textarea id="wbShareUrl" readonly rows="3"
      style="width:100%;box-sizing:border-box;font-size:12px;color:#111827;
             padding:8px;border:1px solid #e5e7eb;border-radius:8px;resize:vertical;
             font-family:ui-monospace,SFMono-Regular,Menlo,monospace;"></textarea>
    <div style="margin-top:8px;display:flex;gap:8px;align-items:center;">
      <button id="wbShareCopy" type="button"
        style="padding:6px 14px;font-size:13px;cursor:pointer;color:#fff;background:#2563eb;
               border:none;border-radius:6px;">复制</button>
      <button id="wbShareClose" type="button"
        style="padding:6px 14px;font-size:13px;cursor:pointer;color:#374151;background:#f3f4f6;
               border:1px solid #d1d5db;border-radius:6px;">关闭</button>
      <span id="wbShareTip" style="font-size:12px;color:#059669;"></span>
    </div>
  </div>
</div>
<script>
(function () {
  var btn = document.getElementById('wbShareBtn');
  var box = document.getElementById('wbShareBox');
  var ta  = document.getElementById('wbShareUrl');
  var tip = document.getElementById('wbShareTip');
  if (!btn) return;
  function currentUrl() {
    try { return window.top.location.href; } catch (e) { return window.location.href; }
  }
  function doCopy() {
    var u = currentUrl();
    ta.value = u;
    ta.focus(); ta.select(); ta.setSelectionRange(0, u.length);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    if (!ok && navigator.clipboard) {
      navigator.clipboard.writeText(u).then(function(){ flash('✅ 已复制到剪贴板'); },
                                            function(){ flash('请手动全选复制'); });
    } else {
      flash(ok ? '✅ 已复制到剪贴板' : '请手动全选复制');
    }
  }
  var timer = null;
  function flash(msg) {
    tip.textContent = msg;
    clearTimeout(timer);
    timer = setTimeout(function(){ tip.textContent = ''; }, 2600);
  }
  btn.addEventListener('click', function () {
    box.style.display = box.style.display === 'none' ? 'block' : 'none';
    if (box.style.display === 'block') doCopy();
  });
  document.getElementById('wbShareCopy').addEventListener('click', doCopy);
  document.getElementById('wbShareClose').addEventListener('click', function () {
    box.style.display = 'none';
  });
})();
</script>
