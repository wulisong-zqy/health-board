<style>

    --bad-bg:#fdeceb; --bad:#b42318; --brand:#1a6fd4; --brand-bg:#eaf2fd;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
       font-size:14px;line-height:1.5}
  .wrap{max-width:1400px;margin:0 auto;padding:24px 20px 60px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
  .stale-banner{background:var(--bad-bg);color:var(--bad);border:1px solid #f3c4c0;
    border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13px;font-weight:500;
    line-height:1.5}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .kpi .lbl{font-size:12px;color:var(--muted);margin-bottom:6px}
  .kpi .val{font-size:26px;font-weight:600;letter-spacing:-.5px}
  .kpi .extra{font-size:12px;color:var(--muted);margin-top:4px}
  nav{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px}
  nav button{background:none;border:none;padding:10px 14px;font-size:14px;cursor:pointer;
             color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
  nav button.active{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
  .panel{display:none} .panel.active{display:block}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  .toolbar input{padding:7px 10px;border:1px solid var(--line);border-radius:7px;
                 background:var(--card);min-width:200px;font-size:13px}
  .ghost{padding:7px 12px;border:1px solid var(--line);background:var(--card);
         border-radius:7px;cursor:pointer;font-size:13px;color:var(--text)}
  .count{margin-left:auto;color:var(--muted);font-size:13px}
  .box{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:auto}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  th{background:#fafbfc;font-weight:600;color:#374151;cursor:pointer;user-select:none;
     position:sticky;top:0;z-index:2}
  th:hover{background:#f0f2f5}
  td.l,th.l{text-align:left}
  tbody tr:hover{background:#f9fafb}
  tfoot td{font-weight:600;background:#fafbfc;border-top:2px solid var(--line)}
  .rate{border-radius:5px;padding:2px 6px;font-variant-numeric:tabular-nums}
  .r-good{background:var(--good-bg);color:var(--good)}
  .r-warn{background:var(--warn-bg);color:var(--warn)}
  .r-bad{background:var(--bad-bg);color:var(--bad)}
  .bar{height:8px;border-radius:4px;background:#eef0f3;overflow:hidden;min-width:70px}
  .bar > i{display:block;height:100%;border-radius:4px}
  .cmp{display:grid;grid-template-columns:110px 1fr 58px 1fr 58px 1fr 58px;
       gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
  .cmp:last-child{border-bottom:none}
  .cmp .mn{font-weight:600}
  .note{color:var(--muted);font-size:12px;padding:10px 16px;border-top:1px solid var(--line)}
  .tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px}
  .t-group{background:var(--brand-bg);color:var(--brand)}
  .t-coach{background:#f3e8fd;color:#7c3aed}
  .desc{max-width:420px;white-space:normal;color:#374151;font-size:12px;line-height:1.45}
</style>
</head>

// ---------- 通用表格 ----------
function renderTable(rows, cols, opts){
  opts = opts || {};
  const rateSet = new Set(opts.rates||[]);
  let view = rows.slice(), sortKey = null, sortDir = 1;

  const box = document.createElement("div");
  box.innerHTML =
    '<div class="toolbar">' +
      '<input type="search" placeholder="'+(opts.placeholder||"搜索")+'" />' +
      '<button class="ghost dl">导出 CSV</button>' +
      '<span class="count"></span>' +
    '</div>' +
    '<div class="box"><table><thead></thead><tbody></tbody><tfoot></tfoot></table></div>';
  const input = box.querySelector("input");
  const tbl = box.querySelector("table");

  function drawHead(){
    tbl.querySelector("thead").innerHTML = "<tr>" + cols.map(c => {
      const ci = c.idx, name = c.name;
      const cls = c.left ? ' class="l"' : "";
      return "<th"+cls+' data-i="'+ci+'">'+name+"</th>";
    }).join("") + "</tr>";
    tbl.querySelectorAll("th").forEach(th => {
      th.onclick = () => {
        const i = +th.dataset.i;
        if(sortKey === i) sortDir = -sortDir; else { sortKey = i; sortDir = 1; }
        draw();
      };
    });
  }

  function cellHTML(row, c){
    const v = row[c.idx];
    if(c.render) return c.render(v, row);
    if(typeof v === "number") return rateSet.has(c.name) ? rateCell(v) : fmtInt(v);
    return v == null ? "-" : String(v);
  }

  function sortRows(list){
    if(sortKey == null) return list;
    return list.slice().sort((a,z) => {
      let x = a[sortKey], y = z[sortKey];
      if(typeof x === "number" && typeof y === "number") return (x-y)*sortDir;
      x = x == null ? "" : String(x); y = y == null ? "" : String(y);
      return x.localeCompare(y, "zh-CN") * sortDir;
    });
  }

  function draw(){
    const q = (input.value||"").trim().toLowerCase();
    let list = view.filter(r => !q || r.some(v => v!=null && String(v).toLowerCase().includes(q)));
    list = sortRows(list);
    tbl.querySelector("tbody").innerHTML = list.map(r =>
      "<tr>" + cols.map(c => '<td class="'+(c.left?"l":"")+'">'+cellHTML(r,c)+"</td>").join("") + "</tr>"
    ).join("") || '<tr><td class="l" colspan="'+cols.length+'">没有匹配的记录</td></tr>';
    box.querySelector(".count").textContent = list.length + " / " + rows.length + " 行";
    if(opts.footer){
      const f = opts.footer(list);
      tbl.querySelector("tfoot").innerHTML = f ? "<tr>" + cols.map((c,i) =>
        '<td class="'+(c.left?"l":"")+'">'+f[i]+"</td>").join("") + "</tr>" : "";
    }
  }

  box.querySelector(".dl").onclick = () => {
    const q = (input.value||"").trim().toLowerCase();
    const list = sortRows(view.filter(r => !q || r.some(v => v!=null && String(v).toLowerCase().includes(q))));
    const head = cols.map(c => '"'+c.name+'"').join(",");
    const body = list.map(r => cols.map(c => {
      let v = r[c.idx]; v = v==null?"":String(v);
      return '"' + v.replace(/"/g,'""') + '"';
    }).join(",")).join("\n");
    const blob = new Blob(["\ufeff"+head+"\n"+body], {type:"text/csv;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = (opts.filename||"看板数据") + ".csv";
    a.click();
  };

  input.oninput = draw;
  drawHead(); draw();
  return box;
}

function colsOf(names, opts){
  opts = opts||{};
  return names.map((n,i) => ({name:n, idx:i, left: i===0 || (opts.leftCols||[]).includes(i)}));
}

    else if(i===1) v = fmtInt(ev);
    else if(i===2) v = fmtInt(hp);
    else if(i===3) v = rate==null?"-":'<span class="rate '+rateCls(rate)+'">'+fmtRate(rate)+"</span>";
    else if(i===4) v = fmtInt(vt);
    else if(i===BOARD_COLS_LEN-1) v = fmtInt(cov);
    else {
      // 模块列：用后端按原始记录算好的合计模块健康率（达标数/评估总数，分数0~1），
      // 不再把每个人的百分比加总（那会爆成几百 %）。
      const mi = i - MODSTART;
      const mr = (moduleRates && mi>=0 && mi<MODLEN) ? moduleRates[mi] : null;
      v = mr==null ? "-" : '<span class="rate '+rateCls(mr*100)+'">'+fmtRate(mr*100)+"</span>";
    }
    out.push(v);
  }
  return out;
}
const BOARD_COLS_LEN = 11;
const MODSTART = 5;
const MODLEN = 5;

<div id="wbShareBar" style="position:fixed;right:18px;bottom:18px;z-index:2147483000;
     font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;">
  <button id="wbShareBtn" type="button"
    style="padding:9px 16px;font-size:13px;line-height:1;cursor:pointer;color:#1f2937;
           background:#ffffff;border:1px solid #d1d5db;border-radius:999px;
           box-shadow:0 2px 10px rgba(0,0,0,.12);white-space:nowrap;">
    🔗 复制本页链接
  </button>
  <div id="wbShareBox"
    style="display:none;margin-bottom:8px;padding:12px;width:min(560px,86vw);
           background:#fff;border:1px solid #d1d5db;border-radius:12px;
           box-shadow:0 8px 28px rgba(0,0,0,.16);">
    <div style="font-size:12px;color:#6b7280;margin-bottom:6px;">
      这是本页完整地址，把它粘到钉钉群快捷栏即可（链接永久，内容每天自动更新）
    </div>
    <textarea id="wbShareUrl" readonly rows="3"
      style="width:100%;box-sizing:border-box;font-size:12px;color:#111827;
             padding:8px;border:1px solid #e5e7eb;border-radius:8px;resize:vertical;
             font-family:ui-monospace,SFMono-Regular,Menlo,monospace;"></textarea>
    <div style="margin-top:8px;display:flex;gap:8px;align-items:center;">
      <button id="wbShareCopy" type="button"
        style="padding:6px 14px;font-size:13px;cursor:pointer;color:#fff;background:#2563eb;
               border:none;border-radius:6px;">复制</button>
      <button id="wbShareClose" type="button"
        style="padding:6px 14px;font-size:13px;cursor:pointer;color:#374151;background:#f3f4f6;
               border:1px solid #d1d5db;border-radius:6px;">关闭</button>
      <span id="wbShareTip" style="font-size:12px;color:#059669;"></span>
    </div>
  </div>
</div>
<script>
(function () {
  var btn = document.getElementById('wbShareBtn');
  var box = document.getElementById('wbShareBox');
  var ta  = document.getElementById('wbShareUrl');
  var tip = document.getElementById('wbShareTip');
  if (!btn) return;
  function currentUrl() {
    try { return window.top.location.href; } catch (e) { return window.location.href; }
  }
  function doCopy() {
    var u = currentUrl();
    ta.value = u;
    ta.focus(); ta.select(); ta.setSelectionRange(0, u.length);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    if (!ok && navigator.clipboard) {
      navigator.clipboard.writeText(u).then(function(){ flash('✅ 已复制到剪贴板'); },
                                            function(){ flash('请手动全选复制'); });
    } else {
      flash(ok ? '✅ 已复制到剪贴板' : '请手动全选复制');
    }
  }
  var timer = null;
  function flash(msg) {
    tip.textContent = msg;
    clearTimeout(timer);
    timer = setTimeout(function(){ tip.textContent = ''; }, 2600);
  }
  btn.addEventListener('click', function () {
    box.style.display = box.style.display === 'none' ? 'block' : 'none';
    if (box.style.display === 'block') doCopy();
  });
  document.getElementById('wbShareCopy').addEventListener('click', doCopy);
  document.getElementById('wbShareClose').addEventListener('click', function () {
    box.style.display = 'none';
  });
})();
</script>
